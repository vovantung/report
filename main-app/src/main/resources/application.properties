##################################
# REDIS SENTINEL CONFIGURATION
##################################

spring.data.redis.client-type=lettuce
spring.data.redis.sentinel.master=mymaster
spring.data.redis.password=Phan@123
spring.data.redis.sentinel.nodes=redis-sentinel.redis.svc.cluster.local:26379

# database index
spring.data.redis.database=0

##################################
# CONNECTION POOL (PRODUCTION)
##################################

spring.data.redis.timeout=500

spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=2000

##################################
# SAFETY FLAGS
##################################

spring.data.redis.lettuce.shutdown-timeout=200ms


# ===============================
# KAFKA COMMON
# ===============================

spring.kafka.bootstrap-servers=kafka-cluster-kafka-bootstrap.kafka:9093
spring.kafka.security.protocol=SSL

# ===== CLIENT CERT =====
spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=file:/etc/kafka/tls/user.p12
spring.kafka.ssl.key-store-password=${KAFKA_USER_PASSWORD}

# ===== TRUST KAFKA BROKER =====
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-location=file:/etc/kafka/ca/ca.crt

spring.kafka.properties.ssl.endpoint.identification.algorithm=
# ===============================
# PRODUCER CONFIG
# ===============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Reliability (prod-friendly)
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.max-in-flight-requests-per-connection=5

# Optional tuning
spring.kafka.producer.batch-size=32768
spring.kafka.producer.linger-ms=5
spring.kafka.producer.compression-type=lz4


logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO


